<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
<style>
    input,button{
        border: 1px solid;
        border-radius: 5px;
        padding: 5px 10px;
    }
    button{
        background: #ffffff;
        color: #212121;
        cursor: pointer;

    }
</style>
</head>
<body class="bg-[#212121] text-white">
    <div class="max-w-[1200px] w-full mx-auto space-y-3">
        <h1 class="text-center font-semibold">BMI Calculator</h1>
        <form action="" class="space-y-3 text-center flex  flex-col items-center justify-center">
            <div class="flex items-center gap-6 justify-between">
                <label for="height">Height (in Cm)</label>
                <input type="text" id="height">
            </div>
            <div class="flex items-center gap-6 justify-between">
                <label for="weight">Weight (in Kgs)</label>
                <input type="text" id="weight">
            </div>
            <div class="flex items-center gap-6 justify-between">
                <label for="result">Result</label>
                <p id="result"></p>
            </div>
            <div class="mt-8">
                <button type="submit" id="calculate">Calculate</button>
            </div>
            <div id="weightGuides mt-5">
                <h3>Weight Guides</h3>
                <p>Under weight  = less than 18.6</p>
                <p>Normal weight  = less than 24.6</p>
                <p>Over weight  = less than 24.6</p>
            </div>
        </form>

    </div>

    <script src="./bmiGenerator.js"></script>
</body>
</html>
