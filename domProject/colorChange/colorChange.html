<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLOR CHANGE</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        button {
            padding: 5px 12px;
            border: 1px solid;
            border-radius: 5px;
            cursor: pointer;
        }

        .red {
            background-color: red;
        }
    </style>
</head>

<body>
    <div class="h-screen ">
        <div class="max-w-[1200px] w-full fixed bottom-5 mx-auto left-1/2 top-1/2 h-max -translate-1/2">
            <div class="buttons flex justify-center gap-4 ">
                <button id="gray">Gray</button>
                <button id="yellow">Yellow</button>
                <button id="blue">Blue</button>
                <button id="red">Red</button>
            </div>
        </div>
    </div>
    <script src="./colorChange.js">
        
    </script>
</body>

</html>
