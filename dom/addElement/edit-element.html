<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Elements</title>

</head>
<body style="background-color: #212121; color: #ffffff;">
<ul class="language">
    <li>Javscript</li>
    <li>Cpp</li>
</ul>


    <script>
        // Normal Function
    function addLanguage(langName){
        const addList = document.createElement('li');
        addList.innerHTML=`${langName}`;
        document.querySelector(".language").appendChild(addList)
    }
    // addLanguage('Python')
    // Optimized Add langugae 
    function optimizedLanguage(langName){
        const li = document.createElement("li");
        li.appendChild(document.createTextNode(langName))
        document.querySelector(".language").appendChild(li)
    }
    optimizedLanguage("Swift")

    // Edit
    const editLi = document.querySelector("li:nth-child(2)");
    // editLi.appendChild(document.createTextNode(" & SW"))
    // document.querySelector('.language').replaceWith(editLi)
    const newEditLi = document.createElement("li")
    newEditLi.textContent = "Golang"
    editLi.replaceWith(newEditLi)



















    </script>
    
</body>
</html>
