<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Async Project</h1>
    <button id="stop">Stop</button>


    <script>
        // Set Timeout => It will execute single time only
        const sayHimanshu = function () {
            console.log("Himanshu");

        }
        setTimeout(sayHimanshu, 2000)
        const changeHeading = function () {
            document.querySelector('h1').innerHTML = "Himanshu"

        }
        const changeMe = setTimeout(changeHeading, 2000)
        // document.querySelector('h1').innerHTML = "Himanshu"
        // setTimeout(function () {
        //     console.log("Himanshu");

        // }, 2000)

        // Clear Timeout - It needs reference
        // clearTimeout(changeMe)

        document.querySelector('#stop').addEventListener('click',function(){
            console.log("Stop");
            clearTimeout(changeMe)
            
        })


    </script>
</body>

</html>
